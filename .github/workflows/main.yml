name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Build
        run: |
          find . -maxdepth 1 -name '*.zip' -exec unzip -oq {} \;
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)")
          cd "$DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: Esle-debug-apk
          path: out/*.apk
